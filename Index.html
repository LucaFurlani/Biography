<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biografie belle!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      body{
        margin: 0;
        display: flex;
        width: 100%;

        align-items: center;
        flex-direction: column;
      }

      .box{
        width: fit-content;
        height: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }

      .card img{
        height: auto;
        width: 100%;
      }
    </style>

</head>
  <body>
    <h1>Ecco le nostre biografie belle!</h1>
    <div class="box">
        <div class="card" style="width: 18rem;">

            <div class="card-body">
              <h5 class="card-title">Hayao Miyazaki</h5>
              <p class="card-text">Biografia scritta ufficialmente da Michea Dall'aglio.</p>
              <a href="Dall'aglio" class="btn btn-primary">Vai alla biografia</a>
            </div>
        </div>

        <div class="card" style="width: 18rem;">

            <div class="card-body">
              <h5 class="card-title">Dante Alighieri</h5>

        </div>

        <div class="card" style="width: 18rem;">

            <div class="card-body">
              <h5 class="card-title">Lando Norris</h5>
              <p class="card-text">Biografia scritta ufficialmente da Luca Truglia.</p>
              <a href="truglia" class="btn btn-primary">Vai alla biografia</a>

        </div>
    </div>

</html>
